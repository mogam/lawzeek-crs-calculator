<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:"Google Sans";font-weight:400 700;src:url("../../assets/fonts/google-sans-latin.woff2") format("woff2")}
/* WordPress.org banner (772x250 and 1544x500): the problem on the left, the plugin's answer on the right. Sizes use vh so both renders match. */
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;font-family:"Google Sans",Inter,"Avenir Next",-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:#f7f4ed;color:#2a2219;display:flex;align-items:center;gap:5vh;padding:0 8vh;box-sizing:border-box;position:relative}
body::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(42,34,25,.10) 1px,transparent 1px);background-size:2.2vw 2.2vw;mask-image:linear-gradient(90deg,transparent 40%,#000);pointer-events:none}
.col{position:relative;z-index:1}
body>*{zoom:1.14}
.tag{display:inline-block;font-size:3.6vh;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.8vh 2.4vh;border-radius:99px}
.problem{flex:0 0 33%}
.problem .tag{background:#fbe4e1;color:#a5321f}
.problem h2{margin:3.2vh 0 0;font-size:10vh;line-height:1.12;font-weight:600;letter-spacing:-.015em}
.problem h2 q{quotes:"\201C" "\201D"}
.problem p{margin:2.6vh 0 0;font-size:5.2vh;line-height:1.3;color:#6b6156}
.arrow{flex:none;width:12vh;height:12vh;border-radius:50%;background:#2a2219;display:grid;place-items:center;position:relative;z-index:1}
.arrow svg{width:6vh;height:6vh}
.solution{flex:1;display:flex;flex-direction:column;gap:2.4vh}
.solution .tag{background:#dff3e8;color:#17663f;align-self:flex-start}
.cards{display:flex;gap:3vh;align-items:stretch}
.card{background:#fff;border-radius:3vh;padding:3.4vh 4vh;box-shadow:0 1.6vh 5vh rgba(42,34,25,.14)}
.score{border-left:1vh solid #7473ed;flex:0 0 auto}
.card small{display:block;font-size:4vh;color:#6b6156}
.score b{display:block;font-size:13vh;line-height:1.05;letter-spacing:-.02em}
.pill{display:inline-block;margin-top:1.2vh;font-size:3.8vh;font-weight:600;padding:.5vh 2.2vh;border-radius:99px;background:#fff8e8;color:#8a5a00;border:.3vh solid #f5bc41}
.lead{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:2vh}
.who{display:flex;align-items:center;justify-content:space-between;gap:2vh}
.who b{font-size:5.6vh;font-weight:600}
.hot{font-size:3.6vh;font-weight:600;padding:.4vh 1.8vh;border-radius:1vh;background:#fde7ea;color:#b4233f}
.book{display:inline-flex;align-items:center;gap:1.4vh;align-self:flex-start;background:#5b55d6;color:#fff;font-size:4vh;font-weight:600;padding:1.6vh 3vh;border-radius:1.6vh}
.book svg{width:3.6vh;height:3.6vh}
</style></head><body>
<div class="col problem">
  <span class="tag">The problem</span>
  <h2><q>What’s my CRS score?</q></h2>
  <p>Visitors ask, check it somewhere else and never contact you.</p>
</div>
<div class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="col solution">
  <span class="tag">The fix</span>
  <div class="cards">
    <div class="card score"><small>Estimated CRS score</small><b>498</b><span class="pill">+62 with a French test</span></div>
    <div class="card lead">
      <small>New lead in WordPress</small>
      <div class="who"><b>Emily Tremblay</b><span class="hot">Hot</span></div>
      <span class="book">Book a consultation<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
  </div>
</div>
</body></html>
