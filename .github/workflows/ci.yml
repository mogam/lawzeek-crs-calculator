# Checks every push and pull request. Also called by release.yml before anything is published.
# Actions are pinned to full commit SHAs (supply-chain safety); Dependabot keeps them up to date.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '${{ matrix.php }}', coverage: none, tools: none }
      - name: Lint shipped PHP files
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './tests/*' -print0)
          exit "$status"

  standards:
    name: Security and compatibility (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '8.2', coverage: none, tools: composer:v2 }
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint

  unit:
    name: CRS parity and built assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '8.2', coverage: none, tools: none }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
      - name: CRS engine matches the reference scores
        run: npm run test:parity
      - name: Committed admin.css matches its Tailwind source
        run: |
          npm run build:css
          git diff --exit-code -- assets/css/admin.css
      - name: Zip builds and version numbers agree
        run: npm run zip

  wordpress:
    name: WordPress tests and browser tests
    needs: [php-lint, standards, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Start WordPress (wp-env)
        run: npx wp-env start
      - name: Tests inside WordPress
        run: npm run test:wp
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  plugin-check:
    name: WordPress.org Plugin Check
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: bash bin/build-zip.sh
      - uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: dist/lawzeek-crs-calculator

  package:
    name: Plugin zip
    needs: [wordpress, plugin-check, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: bash bin/build-zip.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lawzeek-crs-calculator
          path: dist/*.zip*
          retention-days: 30
