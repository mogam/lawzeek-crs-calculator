version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { dev-tools: { patterns: ["*"] } }
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    groups: { php-tools: { patterns: ["*"] } }
