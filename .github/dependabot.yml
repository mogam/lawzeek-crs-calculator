version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { dev-tools: { patterns: ["*"], update-types: ["minor", "patch"] } }
    ignore:
      # Tailwind 4 changes the config format the admin CSS is built with; upgrade by hand when ready.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    groups: { php-tools: { patterns: ["*"] } }
